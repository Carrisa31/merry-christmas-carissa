name: Publish Christmas Tree
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: christmas-pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.site.outputs.page_url }}
    steps:
      - name: Check out project
        uses: actions/checkout@v4
      - name: Import initial source
        if: hashFiles('index.html') == ''
        shell: bash
        run: |
          curl --fail --location --retry 3 --output /tmp/christmas-site.zip 'https://carissa-christmas-memories.fond-mint-1211.chatgpt.site/downloads/christmas-site.zip'
          echo '5426cce025bcc94c63482904152b51ff2924a6ef90fcc79e661af2d5bc050b17  /tmp/christmas-site.zip' | sha256sum --check
          unzip -q /tmp/christmas-site.zip -d .
          echo '' | base64 --decode > README.md
          echo '' | base64 --decode > LICENSE
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html app.js style.css vendor .nojekyll README.md LICENSE
          if ! git diff --cached --quiet; then
            git commit -m 'Publish complete Christmas tree source with MIT license'
            git push origin HEAD:main
          fi
      - name: Prepare Pages
        uses: actions/configure-pages@v5
      - name: Prepare website files
        run: |
          mkdir -p _site
          cp index.html app.js style.css _site/
          cp -R vendor _site/vendor
          touch _site/.nojekyll
      - name: Upload static website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish website
        id: site
        uses: actions/deploy-pages@v5
